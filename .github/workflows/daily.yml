name: Daily article

on:
  schedule:
    - cron: '50 22 * * *'   # 06:50 Taiwan time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/daily.py
      - name: Save
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add daily.json
          git diff --cached --quiet || git commit -m "Daily article $(date -u +%F)"
          git push
