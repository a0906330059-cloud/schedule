name: Build Android app

on:
  push:
    branches: [main]
    paths-ignore:
      - 'daily.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Put the web app inside the Android app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html app.js summary.js seed.json quotes.json manifest.json icon-192.png android/app/src/main/assets/www/

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "::warning::No KEYSTORE_B64 secret yet - using a temporary key (updates will need a reinstall)"
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -storepass schedule123 -keypass schedule123 \
              -alias schedule -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Wade Schedule"
          fi

      - name: Build APK
        working-directory: android
        env:
          KS_PATH: ${{ runner.temp }}/release.jks
          KS_PASS: schedule123
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk schedule.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: 日程表 Android 版
          body: 用手機下載 schedule.apk 安裝。每次更新都會換成最新版。
          files: schedule.apk
          make_latest: true
